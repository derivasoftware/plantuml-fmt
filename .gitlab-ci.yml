# CI — plantuml-fmt. The grammar dependency is a public GitHub git
# package; pip clones it directly.

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml

test:
  stage: test
  extends: [.on-mr-and-main]
  script:
    - |
      set -euo pipefail
      python3 -m venv .venv-ci
      ./.venv-ci/bin/pip install -q -e ".[dev]"
      mkdir -p test-results
      ./.venv-ci/bin/pytest -q -m "not system" \
        --junitxml=test-results/junit.xml \
        --cov=plantuml_fmt --cov-report=xml:test-results/coverage-ut.xml
      ./.venv-ci/bin/pytest -q -m system \
        --junitxml=test-results/junit-st.xml \
        --cov=plantuml_fmt --cov-report=xml:test-results/coverage-st.xml
