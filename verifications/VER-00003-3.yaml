verification:
  id: VER-00003-3
  req_id: REQ-00003-5
  title: Property test and system corpus pass compare whitespace-squashed content
  description: >
    Squashing every space and tab out of each line yields identical
    sequences for input and output. The unit property test verifies it
    over the golden corpus; the system pass (pytest -m system) asserts
    the same invariant plus idempotence over every diagram in the
    repository's design tree, or any corpus named by
    PLANTUML_FMT_CORPUS.
  method: test
  test_ids:
    - tests/integration/test_formatter.py::test_only_whitespace_changes
    - tests/integration/test_system_corpus.py::test_corpus_file_formats_lossless_and_idempotent
  status: APPROVED
