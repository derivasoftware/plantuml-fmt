requirement:
  id: REQ-00003-2
  title: The formatter shall change only whitespace of statement lines
  description: >
    The formatter shall change only whitespace of statement lines: v1
    rewrites normalize spacing anywhere in a rewritable line (relations,
    members), not just its indentation, and every non-whitespace byte is
    preserved in order. Opaque content remains byte-identical.
  rationale: >
    Losslessness by construction: rewriters re-emit the CST tokens with
    canonical whitespace between them and refuse any line they cannot
    faithfully rebuild. Revision 2 widens the v0 guarantee (leading
    whitespace only) to whole-line whitespace, which is what the
    intra-line style rules require.
  status: DRAFT
  asil: QM
  parent_ids:
    - SREQ-00002-1
  tags:
    - losslessness
