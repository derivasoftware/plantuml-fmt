verification:
  id: VER-00011-4
  req_id: REQ-00011-1
  title: Unit tests pin the C++ signature directions through the formatter
  description: >
    Revision (4): grammar 0.9.7 lets a plain identifier type bind the
    method path without a template clause; two cases pin that it stays
    left as written and that the degenerate dual-type line keeps both
    sides.
    Revision (3): with grammar 0.9.6 a template comma inside a parameter
    no longer splits it, so the parameter text round-trips verbatim; one
    case pins it.
    Revision (2): five cases pin the method-level template clause of
    grammar 0.9.5 — preserved behind a C++ return type, behind a plain
    type, in the canonical colon form, with a nested return type and a
    qualifier, and the empty clause falling through lossless.
    tests/test_cpp_members.py holds seven cases, each asserting
    idempotency alongside its shape: the left return type stays left
    (plain and nested-template), the deleted assignment keeps its form
    with single spacing, the cv-qualifier stays between the parens and
    the canonical colon, a callable parameter's inner parentheses do
    not split the list, the canonical colon form still normalizes its
    spacing, and the unclosed-template line passes through lossless.
  method: test
  test_ids:
    - tests/integration/test_cpp_members.py::test_template_commas_keep_one_parameter
    - tests/integration/test_cpp_members.py::test_left_return_type_is_preserved
    - tests/integration/test_cpp_members.py::test_nested_template_return_survives_whole
    - tests/integration/test_cpp_members.py::test_deleted_assignment_keeps_form_and_spacing
    - tests/integration/test_cpp_members.py::test_cv_qualifier_sits_before_the_canonical_colon
    - tests/integration/test_cpp_members.py::test_callable_parameter_inner_parens_do_not_split
    - tests/integration/test_cpp_members.py::test_canonical_colon_form_still_normalizes
    - tests/integration/test_cpp_members.py::test_unclosed_template_falls_through_lossless
    - tests/integration/test_cpp_members.py::test_template_clause_survives_behind_cpp_return_type
    - tests/integration/test_cpp_members.py::test_template_clause_survives_behind_plain_type
    - tests/integration/test_cpp_members.py::test_template_clause_survives_in_canonical_colon_form
    - tests/integration/test_cpp_members.py::test_template_clause_with_nested_return_and_qualifier
    - tests/integration/test_cpp_members.py::test_empty_template_clause_falls_through_lossless
    - tests/integration/test_cpp_members.py::test_plain_return_type_stays_left
    - tests/integration/test_cpp_members.py::test_both_directions_on_one_line_lose_nothing
  status: APPROVED
