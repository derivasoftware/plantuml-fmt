# CI — plantuml-fmt. The grammar dependency is a private git package, so
# pip clones it with the job token via the insteadOf rewrite (scoped to a
# job-local gitconfig, never the runner's global one).

include:
  - project: deriva/infra/ci-templates
    ref: main
    file:
      - /templates/base.yml

test:
  stage: test
  extends: [.on-mr-and-main]
  script:
    - |
      set -euo pipefail
      export GIT_CONFIG_GLOBAL="$CI_PROJECT_DIR/.gitconfig-ci"
      git config --file "$GIT_CONFIG_GLOBAL" \
        url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf \
        "https://${CI_SERVER_HOST}/"
      python3 -m venv .venv-ci
      ./.venv-ci/bin/pip install -q -e ".[dev]"
      ./.venv-ci/bin/python scripts/gen_evidence.py
