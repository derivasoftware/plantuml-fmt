requirement:
  id: SREQ-00002-1
  title: The formatter shall preserve every input token byte-identically
  description: >
    The formatter shall preserve every input token byte-identically.
  rationale: >
    Only whitespace may change between input and output; everything after the first non-whitespace byte of a line is untouchable in v0. Losslessness is what makes a formatter safe to run unattended in pre-commit.
  owner: dcoello-dev
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00001-1
  tags:
    - language-tooling
    - data-stewardship
