requirement:
  id: REQ-00011-1
  title: The formatter shall preserve C++ member signatures in their written direction
  description: >
    A member parsed with a C++ left return type shall re-emit as
    type name(parameters), never forced into the canonical
    name(parameters) : type direction; trailing qualifiers (const,
    noexcept, override, = 0, = default, = delete) shall re-emit with
    single spacing, in their written position — end of line, or between
    the parentheses and the canonical colon; and a callable parameter's
    inner parentheses shall stay inside one parameter. A C++-shaped
    line the grammar leaves raw shall pass through byte-identically.
  rationale: >
    The grammar's REQ-00028-1 makes both member directions structural;
    without this rule the rewriter would translate every C++ signature
    into the canonical direction, changing tokens an author wrote and
    breaking downstream coherence checks that compare signatures
    against headers (the failure the mirror pull request
    derivasoftware/plantuml-fmt#1 reported as std : :string). Losslessy
    the direction is style; preserving it is what keeps the formatter
    safe over foreign C++ corpora.
  owner: dcoello-dev
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00001-1
  tags: [members, cpp]
