verification:
  id: VER-00002-2
  req_id: REQ-00002-1
  title: Idempotency holds on the golden corpus and the system corpus pass
  description: >
    The unit test reformats the formatter's output over the golden
    corpus and asserts it does not change. The system pass (pytest -m
    system) asserts the same fixed point over every diagram in the
    repository's design tree, or any corpus named by
    PLANTUML_FMT_CORPUS.
  method: test
  test_ids:
    - tests/integration/test_formatter.py::test_idempotent
    - tests/integration/test_system_corpus.py::test_corpus_file_formats_lossless_and_idempotent
  status: APPROVED
