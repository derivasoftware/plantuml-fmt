[project]
name = "plantuml-fmt"
version = "0.3.8"
description = "Canonical formatter for PlantUML, built on tree-sitter-plantuml"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dcoello-dev" }]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-plantuml @ git+https://github.com/derivasoftware/tree-sitter-plantuml.git@v0.9.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage"]

[project.scripts]
plantuml-fmt = "plantuml_fmt.cli:main"

[project.urls]
Homepage = "https://github.com/derivasoftware/plantuml-fmt"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "system: end-to-end invariant pass over a real diagram tree",
]
