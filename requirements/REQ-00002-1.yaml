requirement:
  id: REQ-00002-1
  title: The formatter shall reach a fixed point in a single pass
  description: >
    The formatter shall reach a fixed point in a single pass
  rationale: >
    fmt(fmt(x)) == fmt(x); a formatter that oscillates is unusable in pre-commit.
  status: APPROVED
  asil: QM
  parent_ids:
    - SREQ-00003-1
  tags:
    - idempotency
