requirement:
  id: SREQ-00005-1
  title: The tool shall provide a command-line interface with check and write modes
  description: >
    The tool shall provide a command-line interface with check and write modes.
  rationale: >
    plantuml-fmt <paths> writes in place; --check writes nothing, lists offending files and exits nonzero, which is the CI/DoD gate form.
